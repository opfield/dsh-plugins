name: Release

# Push a tag named <package directory>-v<version>, for example mcp-hub-v0.4.1 or
# opfield-v0.5.2. The version must match packages/<directory>/package.json.
on:
  push:
    tags:
      - 'mcp-hub-v*'
      - 'opfield-v*'

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Resolve package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%-v*}"
          version="${tag##*-v}"
          manifest="packages/${dir}/package.json"
          test -f "$manifest" || { echo "::error::no package directory for tag $tag"; exit 1; }
          actual="$(node -p "require('./${manifest}').version")"
          [ "$actual" = "$version" ] || { echo "::error::tag $tag but $manifest has version $actual"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./${manifest}').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - name: Publish
        run: npm publish --workspace "packages/${{ steps.pkg.outputs.dir }}" --provenance --access public
        env:
          # Leave NPM_TOKEN unset when npm trusted publishing is configured for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
