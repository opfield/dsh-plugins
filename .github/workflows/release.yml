name: Release

# Push a tag named <package directory>-v<version>, for example mcp-hub-v0.4.1 or
# opfield-v0.5.2. The version must match packages/<directory>/package.json.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in the repository.
on:
  push:
    tags:
      - 'mcp-hub-v*'
      - 'opfield-v*'

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no dependency cache in release builds
      - name: Resolve package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%-v*}"
          version="${tag##*-v}"
          manifest="packages/${dir}/package.json"
          test -f "$manifest" || { echo "::error::no package directory for tag $tag"; exit 1; }
          actual="$(node -p "require('./${manifest}').version")"
          [ "$actual" = "$version" ] || { echo "::error::tag $tag but $manifest has version $actual"; exit 1; }
          name="$(node -p "require('./${manifest}').name")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # the version document appears right after publishing, the package document only minutes later
          if curl -sf -o /dev/null "https://registry.npmjs.org/${name}/${version}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; only the GitHub release is created"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm version
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('trusted publishing needs npm >= 11.5.1'); process.exit(1) }" "$(npm --version)"
      - run: npm ci
      - run: npm test
      - name: Publish
        if: steps.pkg.outputs.published == 'false'
        run: npm publish --workspace "packages/${{ steps.pkg.outputs.dir }}" --access public
      - name: GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
